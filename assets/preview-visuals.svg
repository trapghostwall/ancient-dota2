<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative Ancient map concept</title>
  <desc id="desc">An original stylized Dota 2 map concept with lanes, rune markers, ward circles, hero dots, and an objective timer panel. This is not a game capture.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070b"/>
      <stop offset="1" stop-color="#0e1017"/>
    </linearGradient>
    <linearGradient id="map" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1118"/>
      <stop offset="0.55" stop-color="#0c1415"/>
      <stop offset="1" stop-color="#131018"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>

  <rect x="40" y="40" width="1200" height="48" rx="8" fill="#0b0e15" stroke="#242a37"/>
  <path d="M58 52L72 64L58 76L44 64Z" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <text x="86" y="69" fill="#f2f4f8" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Ancient</text>
  <rect x="212" y="52" width="76" height="24" rx="4" fill="#121827" stroke="#10b981" stroke-opacity="0.55"/>
  <text x="224" y="69" fill="#f59e0b" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1">DOTA 2</text>
  <text x="1160" y="69" text-anchor="end" fill="#8b94a7" font-family="Consolas, monospace" font-size="10" letter-spacing="1.4">MAP CONCEPT / STYLIZED</text>

  <rect x="40" y="106" width="880" height="554" rx="10" fill="url(#map)" stroke="#242a37"/>
  <rect x="40" y="106" width="880" height="554" rx="10" fill="url(#grid)"/>

  <path d="M110 586L360 474L610 356L840 236" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="46" stroke-linecap="round"/>
  <path d="M110 586L360 474L610 356L840 236" fill="none" stroke="#f59e0b" stroke-opacity="0.10" stroke-width="3" stroke-dasharray="12 12"/>
  <path d="M100 220L330 300L560 390L840 500" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="40" stroke-linecap="round"/>
  <path d="M100 220L330 300L560 390L840 500" fill="none" stroke="#10b981" stroke-opacity="0.10" stroke-width="3" stroke-dasharray="12 12"/>
  <path d="M150 590L390 430L640 270L820 130" fill="none" stroke="#ffffff" stroke-opacity="0.055" stroke-width="34" stroke-linecap="round"/>

  <path d="M820 140C720 230 640 290 560 350C480 410 380 490 140 600" fill="none" stroke="#4f7fa8" stroke-opacity="0.25" stroke-width="22"/>
  <path d="M820 140C720 230 640 290 560 350C480 410 380 490 140 600" fill="none" stroke="#7dd3fc" stroke-opacity="0.18" stroke-width="2" stroke-dasharray="10 10"/>

  <g opacity="0.85">
    <circle cx="250" cy="240" r="74" fill="#10b981" fill-opacity="0.05" stroke="#10b981" stroke-opacity="0.22"/>
    <circle cx="250" cy="240" r="48" fill="none" stroke="#10b981" stroke-opacity="0.18"/>
    <circle cx="700" cy="510" r="66" fill="#f59e0b" fill-opacity="0.04" stroke="#f59e0b" stroke-opacity="0.18"/>
    <circle cx="700" cy="510" r="42" fill="none" stroke="#f59e0b" stroke-opacity="0.14"/>
    <circle cx="590" cy="250" r="48" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="240" cy="470" r="54" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-opacity="0.07"/>
  </g>

