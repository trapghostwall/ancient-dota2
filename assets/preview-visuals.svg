    <text x="188" y="532" fill="#f59e0b" font-family="Consolas, monospace" font-size="10">0:14</text>
  </g>
  <g>
    <circle cx="760" cy="180" r="18" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="2"/>
    <path d="M760 170L768 180L760 190L752 180Z" fill="#10b981"/>
    <text x="788" y="176" fill="#d9dee8" font-family="Consolas, monospace" font-size="10" letter-spacing="1">BOT RUNE</text>
    <text x="788" y="192" fill="#f59e0b" font-family="Consolas, monospace" font-size="10">0:14</text>
  </g>

  <g>
    <circle cx="350" cy="470" r="36" fill="#57d68d" fill-opacity="0.05" stroke="#57d68d" stroke-opacity="0.35" stroke-dasharray="4 4"/>
    <circle cx="350" cy="470" r="7" fill="#57d68d"/>
    <text x="350" y="516" text-anchor="middle" fill="#8b94a7" font-family="Consolas, monospace" font-size="9">RADIANT</text>
  </g>
  <g>
    <circle cx="640" cy="300" r="36" fill="#f87171" fill-opacity="0.05" stroke="#f87171" stroke-opacity="0.35" stroke-dasharray="4 4"/>
    <circle cx="640" cy="300" r="7" fill="#f87171"/>
    <text x="640" y="346" text-anchor="middle" fill="#8b94a7" font-family="Consolas, monospace" font-size="9">DIRE</text>
  </g>
  <g>
    <circle cx="470" cy="400" r="28" fill="#fbbf24" fill-opacity="0.07" stroke="#fbbf24" stroke-opacity="0.4" stroke-dasharray="4 4"/>
    <circle cx="470" cy="400" r="5" fill="#fbbf24"/>
    <text x="470" y="442" text-anchor="middle" fill="#8b94a7" font-family="Consolas, monospace" font-size="9">WARD</text>
