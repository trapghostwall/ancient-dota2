    <text x="250" y="304" text-anchor="middle" fill="#f59e0b" font-family="Consolas, monospace" font-size="10">4:32</text>
  </g>

  <g>
    <circle cx="160" cy="520" r="18" fill="#10b981" fill-opacity="0.14" stroke="#10b981" stroke-width="2"/>
