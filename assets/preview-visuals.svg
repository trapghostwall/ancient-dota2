  <path d="M962 154H1218" stroke="#1d232e"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="962" y="186" fill="#d9dee8" font-size="13" font-weight="600">Top rune</text>
    <text x="1218" y="186" text-anchor="end" fill="#f59e0b" font-family="Consolas, monospace" font-size="12">0:14</text>
    <rect x="962" y="198" width="256" height="4" rx="2" fill="#222836"/>
    <rect x="962" y="198" width="196" height="4" rx="2" fill="url(#accent)"/>

    <text x="962" y="232" fill="#d9dee8" font-size="13" font-weight="600">Bottom rune</text>
    <text x="1218" y="232" text-anchor="end" fill="#f59e0b" font-family="Consolas, monospace" font-size="12">0:14</text>
    <rect x="962" y="244" width="256" height="4" rx="2" fill="#222836"/>
    <rect x="962" y="244" width="196" height="4" rx="2" fill="url(#accent)"/>

    <text x="962" y="278" fill="#d9dee8" font-size="13" font-weight="600">Roshan</text>
    <text x="1218" y="278" text-anchor="end" fill="#f59e0b" font-family="Consolas, monospace" font-size="12">4:32</text>
    <rect x="962" y="290" width="256" height="4" rx="2" fill="#222836"/>
    <rect x="962" y="290" width="112" height="4" rx="2" fill="url(#accent)"/>

    <text x="962" y="324" fill="#d9dee8" font-size="13" font-weight="600">Glyph</text>
    <text x="1218" y="324" text-anchor="end" fill="#f59e0b" font-family="Consolas, monospace" font-size="12">1:20</text>
    <rect x="962" y="336" width="256" height="4" rx="2" fill="#222836"/>
    <rect x="962" y="336" width="168" height="4" rx="2" fill="url(#accent)"/>
  </g>

  <path d="M962 366H1218" stroke="#1d232e"/>
  <text x="962" y="400" fill="#10b981" font-family="Consolas, monospace" font-size="11" letter-spacing="2">VISION</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8b94a7">
    <text x="962" y="428">Radiant wards</text>
    <text x="1218" y="428" text-anchor="end" fill="#d9dee8">2</text>
    <text x="962" y="456">Dire wards</text>
    <text x="1218" y="456" text-anchor="end" fill="#d9dee8">1</text>
    <text x="962" y="484">Rune control</text>
    <text x="1218" y="484" text-anchor="end" fill="#f59e0b">contested</text>
  </g>

  <rect x="962" y="512" width="256" height="116" rx="8" fill="#0c1018" stroke="#242a37"/>
  <text x="978" y="536" fill="#6f788a" font-family="Consolas, monospace" font-size="9" letter-spacing="1.4">CONCEPT STATUS</text>
  <text x="978" y="558" fill="#d9dee8" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">Documentation only</text>
  <text x="978" y="578" fill="#8b94a7" font-family="Segoe UI, Arial, sans-serif" font-size="11">No DLL / EXE / offsets</text>
  <path d="M978 590H1202" stroke="#242a37"/>
  <text x="978" y="612" fill="#6f788a" font-family="Consolas, monospace" font-size="9">DOTA 2 / SOURCE 2</text>

  <text x="962" y="688" fill="#6f788a" font-family="Consolas, monospace" font-size="9" letter-spacing="1">DOCS ONLY / NO BINARIES</text>
