    <text x="710" y="432" text-anchor="middle" fill="#8b94a7" font-family="Consolas, monospace" font-size="9">SENTRY</text>
  </g>

  <path d="M40 620H920" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="60" y="646" fill="#6f788a" font-family="Consolas, monospace" font-size="10" letter-spacing="1.2">ILLUSTRATIVE MAP CONCEPT / NOT A GAME CAPTURE</text>

  <rect x="940" y="106" width="300" height="554" rx="10" fill="#0b0e15" stroke="#242a37"/>
