<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Ancient community hub mark</title>
  <desc id="desc">A dark rounded tile with a #10b981 and #f59e0b rune mark and the letter A.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="#07090e"/>
  <rect x="18" y="18" width="220" height="220" rx="44" fill="url(#tile)"/>
  <rect x="18" y="18" width="220" height="220" rx="44" fill="url(#shine)"/>

  <path d="M128 38L204 128L128 218L52 128Z" fill="#07090e" fill-opacity="0.22" stroke="#07090e" stroke-opacity="0.5" stroke-width="3"/>
  <path d="M128 62L180 128L128 194L76 128Z" fill="none" stroke="#07090e" stroke-opacity="0.5" stroke-width="2"/>
  <circle cx="128" cy="128" r="7" fill="#07090e" fill-opacity="0.55"/>

  <text x="128" y="168" text-anchor="middle" fill="#07090e" font-family="Segoe UI, Arial, sans-serif" font-size="104" font-weight="700">A</text>
  <text x="128" y="228" text-anchor="middle" fill="#07090e" opacity="0.62" font-family="Consolas, monospace" font-size="10" letter-spacing="3">DOTA 2 HUB</text>
</svg>
